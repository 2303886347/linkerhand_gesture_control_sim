schema_version: 1
model_id: l30

# 顺序与当前已经验收的 L30 JointState 输出完全一致。
active_joints:
  - wrist_pitch
  - pinky_mcp_roll
  - pinky_mcp_pitch
  - pinky_pip
  - ring_mcp_roll
  - ring_mcp_pitch
  - ring_pip
  - middle_mcp_roll
  - middle_mcp_pitch
  - middle_pip
  - index_mcp_roll
  - index_mcp_pitch
  - index_pip
  - thumb_cmc_yaw
  - thumb_cmc_pitch
  - thumb_mcp
  - thumb_dip

thumb_joints:
  - thumb_cmc_yaw
  - thumb_cmc_pitch
  - thumb_mcp
  - thumb_dip

full_joints:
  - wrist_pitch
  - pinky_mcp_roll
  - pinky_mcp_pitch
  - pinky_pip
  - pinky_dip
  - ring_mcp_roll
  - ring_mcp_pitch
  - ring_pip
  - ring_dip
  - middle_mcp_roll
  - middle_mcp_pitch
  - middle_pip
  - middle_dip
  - index_mcp_roll
  - index_mcp_pitch
  - index_pip
  - index_dip
  - thumb_cmc_yaw
  - thumb_cmc_roll
  - thumb_cmc_pitch
  - thumb_mcp
  - thumb_dip

mimic_joints:
  pinky_dip: {source: pinky_pip, multiplier: 1.0, offset: 0.0}
  ring_dip: {source: ring_pip, multiplier: 1.0, offset: 0.0}
  middle_dip: {source: middle_pip, multiplier: 1.0, offset: 0.0}
  index_dip: {source: index_pip, multiplier: 1.0, offset: 0.0}

locked_joints:
  thumb_cmc_roll: 0.0

# 这里保留迁移前代码中的弧度默认值。左右手实测 YAML 仍会覆盖这些默认值。
