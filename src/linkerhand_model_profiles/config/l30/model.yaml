  wrist_pitch: &fixed
    source: ''
    input_min_rad: 0.0
    input_max_rad: 1.0
    output_min_rad: 0.0
    output_max_rad: 0.0
    invert: false
    fixed_position_rad: 0.0
    safe_position_rad: 0.0
  pinky_mcp_roll: *fixed
  pinky_mcp_pitch:
    source: pinky_mcp_flexion
    input_min_rad: 0.0
    input_max_rad: 1.20
